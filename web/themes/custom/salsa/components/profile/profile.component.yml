$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Profil
description: 'Profilkarte mit Avatar, Anzeigename, Mitglied-seit-Zeile und restlichen Profilfeldern.'
group: 'Salsa am Sund'
status: stable
props:
  type: object
  required:
    - name
  properties:
    name:
      type: string
      title: Name
      examples:
        - 'Kerstin Stettner'
    initials:
      type: string
      title: Initialen
      examples:
        - 'KS'
    picture:
      $ref: json-schema-definitions://canvas.module/image
      title: Profilbild
      type: object
      examples:
        - src: 'assets/profil.jpg'
          alt: 'Profilbild von Kerstin Stettner'
          width: 210
          height: 293
    member_since:
      type: string
      title: Mitglied seit
      examples:
        - 'Mitglied seit 12.03.2021 (vor 5 Jahren)'
slots:
  content:
    title: Inhalt
    description: 'Weitere Profilfelder unter der Kopfzeile.'
