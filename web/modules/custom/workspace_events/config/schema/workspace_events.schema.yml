block.settings.salsa_events:
  type: block_settings
  label: 'Upcoming events block settings'
  constraints:
    FullyValidatable: ~
  mapping:
    organizers:
      type: sequence
      label: 'Organizers'
      sequence:
        type: integer
        label: 'Organizer term ID'
        constraints:
          Range:
            min: 1
    courses:
      type: boolean
      label: 'Show courses'
    locations:
      type: sequence
      label: 'Locations'
      sequence:
        type: integer
        label: 'Location term ID'
        constraints:
          Range:
            min: 1
    limit:
      type: integer
      label: 'Number of events'
      constraints:
        Range:
          min: 1
          max: 50
    show_ical:
      type: boolean
      label: 'Show calendar subscription links'

block.settings.salsa_course_schedule:
  type: block_settings
  label: 'Course schedule block settings'
  constraints:
    FullyValidatable: ~
  mapping:
    locations:
      type: sequence
      label: 'Locations'
      sequence:
        type: integer
        label: 'Location term ID'
        constraints:
          Range:
            min: 1

field.storage_settings.workspace_events_price:
  type: mapping
  label: 'Price per lesson storage settings'
  mapping:
    categories:
      type: sequence
      label: 'Categories'
      sequence:
        type: label
        label: 'Category label'

field.field_settings.workspace_events_price:
  type: mapping
  label: 'Price per lesson field settings'

field.value.workspace_events_price:
  type: mapping
  label: 'Default value'
  mapping:
    category:
      type: string
      label: 'Category'
    amount:
      type: string
      label: 'Amount'

field.widget.settings.workspace_events_price_default:
  type: mapping
  label: 'Price per lesson widget settings'

field.formatter.settings.workspace_events_price_default:
  type: mapping
  label: 'Price per lesson formatter settings'
