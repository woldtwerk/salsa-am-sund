block.settings.salsa_events:
  type: block_settings
  label: 'Upcoming events block settings'
  constraints:
    FullyValidatable: ~
  mapping:
    organizers:
      type: sequence
      label: 'Organizers'
      sequence:
        type: integer
        label: 'Organizer term ID'
        constraints:
          Range:
            min: 1
    courses:
      type: boolean
      label: 'Show courses'
    locations:
      type: sequence
      label: 'Locations'
      sequence:
        type: integer
        label: 'Location term ID'
        constraints:
          Range:
            min: 1
    limit:
      type: integer
      label: 'Number of events'
      constraints:
        Range:
          min: 1
          max: 50
    show_ical:
      type: boolean
      label: 'Show calendar subscription links'

block.settings.salsa_course_schedule:
  type: block_settings
  label: 'Course schedule block settings'
  constraints:
    FullyValidatable: ~
  mapping:
    locations:
      type: sequence
      label: 'Locations'
      sequence:
        type: integer
        label: 'Location term ID'
        constraints:
          Range:
            min: 1

field_widget_action.plugin.attendance_from_photo_participants:
  type: field_widget_action_automator_base
  label: 'Attendance from photo field widget action'
