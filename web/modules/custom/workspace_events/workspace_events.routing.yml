workspace_events.ical:
  path: '/termine.ics'
  defaults:
    _controller: '\Drupal\workspace_events\Controller\IcalController::__invoke'
    _title: 'Termine'
  methods: [GET]
  requirements:
    _access: 'TRUE'

workspace_events.occurrence_ical:
  path: '/termine/{node}/ical'
  defaults:
    _controller: '\Drupal\workspace_events\Controller\IcalController::occurrence'
    _title: 'Termin'
  methods: [GET]
  options:
    parameters:
      node:
        type: entity:node
  requirements:
    node: '\d+'
    _access: 'TRUE'

workspace_events.events_json:
  path: '/termine.json'
  defaults:
    _controller: '\Drupal\workspace_events\Controller\EventsJsonController::__invoke'
    _title: 'Termine'
  methods: [GET]
  requirements:
    _access: 'TRUE'

workspace_events.attendance_recognition_settings:
  path: '/admin/config/services/anwesenheitserkennung'
  defaults:
    _form: '\Drupal\workspace_events\Form\AttendanceRecognitionSettingsForm'
    _title: 'Anwesenheitserkennung'
  requirements:
    _permission: 'administer site configuration'
