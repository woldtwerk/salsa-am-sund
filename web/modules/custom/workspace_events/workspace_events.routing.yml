workspace_events.ical:
  path: '/termine.ics'
  defaults:
    _controller: '\Drupal\workspace_events\Controller\IcalController::__invoke'
    _title: 'Events'
    _title_context: workspace_events
  methods: [GET]
  requirements:
    _access: 'TRUE'

workspace_events.occurrence_ical:
  path: '/termine/{node}/ical'
  defaults:
    _controller: '\Drupal\workspace_events\Controller\IcalController::occurrence'
    _title: 'Event'
    _title_context: workspace_events
  methods: [GET]
  options:
    parameters:
      node:
        type: entity:node
  requirements:
    node: '\d+'
    _access: 'TRUE'

workspace_events.lesson_ical:
  path: '/termine/stunde/{lesson}/ical'
  defaults:
    _controller: '\Drupal\workspace_events\Controller\IcalController::lessonOccurrence'
    _title: 'Lesson'
    _title_context: workspace_events
  methods: [GET]
  options:
    parameters:
      lesson:
        type: entity:lesson
  requirements:
    lesson: '\d+'
    _access: 'TRUE'

workspace_events.events_json:
  path: '/termine.json'
  defaults:
    _controller: '\Drupal\workspace_events\Controller\EventsJsonController::__invoke'
    _title: 'Events'
    _title_context: workspace_events
  methods: [GET]
  requirements:
    _access: 'TRUE'
