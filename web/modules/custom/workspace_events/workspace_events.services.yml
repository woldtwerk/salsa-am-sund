services:
  Drupal\workspace_events\EventOccurrenceRepository:
    autowire: true
  Drupal\workspace_events\EventDescriptionFormatter:
    autowire: true
  Drupal\workspace_events\DetailFieldResolver:
    autowire: true
  Drupal\workspace_events\ConfigRecordLoader:
    arguments:
      - '@config.storage.sync'
      - '@extension.path.resolver'
  Drupal\workspace_events\SiteTimeZone:
    autowire: true
  Drupal\workspace_events\LessonGenerator:
    autowire: true
  Drupal\workspace_events\ScheduleMigrator:
    autowire: true
  Drupal\workspace_events\LessonInstaller:
    autowire: true
  Drupal\workspace_events\CourseDifficultyMigrator:
    arguments:
      - '@entity_type.manager'
      - '@Drupal\workspace_events\ConfigRecordLoader'
  Drupal\workspace_events\DanceFigureInstaller:
    autowire: true
  Drupal\workspace_events\AttendanceRecognitionInstaller:
    autowire: true
  Drupal\workspace_events\MemberOverviewInstaller:
    autowire: true
  Drupal\workspace_events\EventSubscriber\HtmxFlagResponseSubscriber:
    autowire: true
    tags:
      - { name: event_subscriber }
  Drupal\workspace_events\EventSubscriber\MyCoursesRouteSubscriber:
    tags:
      - { name: event_subscriber }
  Drupal\workspace_events\StructuredDataBuilder:
    autowire: true
  Drupal\workspace_events\OrganizerResolver:
    autowire: true
  Drupal\workspace_events\EventFilterFactory:
    arguments:
      - '@Drupal\workspace_events\OrganizerResolver'
  Drupal\workspace_events\Attendance\AttendancePhotoTextParser:
    autowire: true
  Drupal\workspace_events\Attendance\MemberNameLoader:
    autowire: true
  Drupal\workspace_events\Attendance\MemberNameLoaderInterface:
    alias: Drupal\workspace_events\Attendance\MemberNameLoader
  Drupal\workspace_events\Attendance\MemberMatcher:
    autowire: true
  Drupal\workspace_events\Attendance\MistralOcrClientFactory:
    arguments:
      - '@?ai.provider'
      - '@http_client_factory'
  Drupal\workspace_events\Attendance\MistralOcrClientFactoryInterface:
    alias: Drupal\workspace_events\Attendance\MistralOcrClientFactory
  Drupal\workspace_events\Attendance\MistralOcrBackend:
    autowire: true
  Drupal\workspace_events\Attendance\OcrBackendResolver:
    arguments:
      - '@config.factory'
      - '@Drupal\workspace_events\Attendance\MistralOcrBackend'
      - '@?ai.provider'
  Drupal\workspace_events\Attendance\OcrBackendResolverInterface:
    alias: Drupal\workspace_events\Attendance\OcrBackendResolver
  Drupal\workspace_events\Attendance\AttendanceRecognizer:
    autowire: true
