name: Promote

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A newer push to main supersedes a running promote: it fast-forwards production
# to a commit that contains the older one. Grouped by ref, so a manual run from
# another branch (which never promotes) cannot cancel the one from main.
concurrency:
  group: promote-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: woldtwerk-websites/renovate-config/.github/workflows/drupal-ci.yml@885049df5f3cab29ad8c5c327c922659bb90295f # main
    with:
      build-script: typecheck
      # Its post-start hook installs agent skills, not needed in CI.
      ddev-skip-configs: config.ai.yaml

  promote:
    needs: ci
    # A manual run from another branch must not reach production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # A deploy key, not GITHUB_TOKEN: GITHUB_TOKEN cannot update a ref
          # across commits that change .github/workflows, and its pushes do not
          # trigger deploy.yml. A deploy-key push does.
          ssh-key: ${{ secrets.PROMOTE_DEPLOY_KEY }}
      # Renovate automerges tooling updates (pnpm, composer, action digests).
      # They reach production with the next runtime change instead of deploying
      # on their own. The whole BASE..HEAD range is compared, so commits from
      # cancelled runs are still judged.
      - id: changes
        shell: bash
        run: |
          set -euo pipefail

          # same <file> <filter...>: is the filtered file identical at BASE and HEAD?
          # A missing file or a failing filter counts as changed.
          same() {
            local file=$1 old new
            shift
            old=$(git show "$base:$file" | "$@") || return 1
            new=$(git show "$GITHUB_SHA:$file" | "$@") || return 1
            [ "$old" = "$new" ]
          }

          # Paths that cannot change what production runs: tooling, CI and docs.
          non_runtime() {
            case "$1" in
              .github/* | .ddev/* | .vscode/* | .vite-hooks/* | .agents/* | .claude/* | .opencode/*) return 0 ;;
              misc/scaffold/* | */tests/* | *.md) return 0 ;;
              renovate.json | taze.config.js | phpcs.xml.dist | phpstan.neon | skills-lock.json) return 0 ;;
              tsconfig.json | jsconfig.json | globals.d.ts | .editorconfig) return 0 ;;
            esac
            return 1
          }

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            promote=true
            echo "Manual run: promoting." >> "$GITHUB_STEP_SUMMARY"
          elif ! base=$(git rev-parse --verify --quiet origin/production); then
            # A new project has no production branch yet.
            promote=true
            echo "No production branch yet: promoting." >> "$GITHUB_STEP_SUMMARY"
          else
            files=()
            while read -r file; do
              non_runtime "$file" && continue
              # Dependency files only count if they change what gets installed.
              case "$file" in
                # composer/composer is the Composer runtime, not a dependency.
                composer.lock)
                  same "$file" jq -S 'del(."packages-dev", ."content-hash") | .packages |= map(select(.name != "composer/composer"))' && continue ;;
                composer.json)
                  same "$file" jq -S 'del(."require-dev") | del(.require."composer/composer")' && continue ;;
                package.json)
                  same "$file" jq -S 'del(.devEngines)' && continue ;;
                # The first document only locks pnpm itself, the second the project.
                pnpm-lock.yaml)
                  same "$file" yq 'select(document_index == 1)' && continue ;;
              esac
              files+=("$file")
            done < <(git diff --name-only --no-renames "$base" "$GITHUB_SHA")

            if [ ${#files[@]} -eq 0 ]; then
              promote=false
              echo "No runtime changes since production, nothing to promote." >> "$GITHUB_STEP_SUMMARY"
            else
              promote=true
              {
                echo "Runtime changes since production:"
                printf -- '- `%s`\n' "${files[@]}"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          echo "promote=$promote" >> "$GITHUB_OUTPUT"
      # No --force: fast-forward only, so it fails instead of clobbering
      # production if the branches diverged.
      - if: steps.changes.outputs.promote == 'true'
        run: git push origin "$GITHUB_SHA:refs/heads/production"
